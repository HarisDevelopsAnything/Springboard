# ===================================================================
# WellNest Fitness App - Application Configuration
# ===================================================================

# Server
server.port=8080

# MongoDB Database
spring.data.mongodb.uri=mongodb+srv://wellnest_user:Harishk.j12@cluster0.y3snqo0.mongodb.net/wellnest_db?retryWrites=true&w=majority


# JWT Configuration
app.jwt.secret=${JWT_SECRET:DefaultDevSecretKeyChangeThisInProduction2026}
app.jwt.expiration-ms=86400000

# Chat Encryption (AES key must be Base64-encoded 16/24/32-byte key)
app.chat.encryption.key=${CHAT_AES_KEY:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}

# AI Chat (OpenRouter via backend)
app.ai.openrouter.api-url=${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}
app.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
app.ai.openrouter.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
app.ai.openrouter.timeout-ms=${OPENROUTER_TIMEOUT_MS:15000}
app.ai.openrouter.system-prompt=${OPENROUTER_SYSTEM_PROMPT:You are WellNest AI coach. Answer only fitness and wellness topics (workouts, nutrition, sleep, hydration, healthy habits). If a user asks anything outside these topics, politely refuse and redirect to a fitness-related question. Do not provide diagnosis or prescriptions. If user mentions emergency symptoms, advise contacting emergency services or a licensed clinician immediately.}
app.ai.openrouter.strict-domain-filter=${OPENROUTER_STRICT_DOMAIN_FILTER:false}

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:3000,http://localhost:*,http://127.0.0.1:*,https://*.onrender.com,https://*.netlify.app,https://*.vercel.app

# Load secrets from a gitignored file if present (optional)
# Create `src/main/resources/application-secrets.properties` or place on classpath
spring.config.import=optional:classpath:application-secrets.properties

# ===================================================================
# Email / SMTP Configuration (Gmail)
# ===================================================================
# To use Gmail SMTP, you need a Google App Password:
# 1. Go to https://myaccount.google.com/security
# 2. Enable 2-Step Verification
# 3. Search "App Passwords" → Generate one for "Mail"
# 4. Replace these values with your credentials
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
# Set actual username/password via environment variables or application-secrets.properties (gitignored)
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_REQUIRED:true}
app.mail.from=${APP_MAIL_FROM:WellNest <no-reply@wellnest.local>}

# Email From Address
app.mail.from=noreply@wellnest.com

# OTP Configuration
app.otp.expiration-minutes=5
app.otp.length=6

# Mailgun Configuration (for email service)
mailgun.base-url=https://api.mailgun.net/v3
mailgun.domain=sandbox.mailgun.org
mailgun.api-key=dummy-key-for-dev
